# ==============================================================================
# SITE SETTINGS
# ==============================================================================
locale                   : "en-GB"
title                    : "Sphiwe B. Skhosana"
title_separator          : "|"
name                     : "Sphiwe B. Skhosana"
description              : "Lecturer in Statistics at the University of Pretoria. Finite mixture models, varying-coefficient regression, robust estimation and directional statistics."
url                      : "https://Sphiwe-Skhosana.github.io"
baseurl                  : ""
repository               : "Sphiwe-Skhosana/Sphiwe-Skhosana.github.io"

# Optional: uncomment and set once you buy a domain, then add a CNAME file
# url                    : "https://sphiweskhosana.com"

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# ==============================================================================
# PUBLICATION CATEGORIES
# Controls the grouping and order of sections on the /publications/ page.
# The keys here must match the `category:` field in each _publications/*.md file.
# ==============================================================================
publication_category:
  journals:
    title: "Journal Articles"
  chapters:
    title: "Book Chapters"
  preprints:
    title: "Preprints and Work in Progress"
  theses:
    title: "Theses"

# ==============================================================================
# COMMENTS  (off by default — turn on only if you want a blog with discussion)
# ==============================================================================
comments:
  provider               : false

# ==============================================================================
# ANALYTICS  (optional — set provider to "google-gtag" and add your ID)
# ==============================================================================
analytics:
  provider               : false
  google:
    tracking_id          :

# ==============================================================================
# AUTHOR / SIDEBAR PROFILE
# Blank entries are simply not rendered, so delete or fill as you like.
# ==============================================================================
author:
  avatar           : "profile.png"
  name             : "Sphiwe B. Skhosana"
  pubname          : "Skhosana, S. B."
  firstname        : "Sphiwe"
  lastname         : "Skhosana"
  bio              : "Lecturer in Statistics, University of Pretoria. I work on finite mixture models and flexible regression, with applications to energy, environmental and development economics."
  location         : "Pretoria, South Africa"
  employer         : "University of Pretoria"
  pubmed           :
  googlescholar    : "https://scholar.google.com/citations?user=tHMNOwwAAAAJ"
  orcid            : "https://orcid.org/0000-0002-4740-7540"
  researchgate     :
  arxiv            :
  email            : "sphiwe.skhosana@up.ac.za"
  uri              :
  github           : "Sphiwe-Skhosana"
  linkedin         :
  bluesky          :
  mastodon         :
  x                :

# ==============================================================================
# SITE FOOTER
# ==============================================================================
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Sphiwe-Skhosana"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=tHMNOwwAAAAJ"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0002-4740-7540"

# ==============================================================================
# BUILD SETTINGS — leave these alone unless you know why you're changing them
# ==============================================================================
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Africa/Johannesburg

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

# ==============================================================================
# COLLECTIONS
# ==============================================================================
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
