- title: >-
    Predicting student dropout and detecting at-risk students early in the Extended Curriculum
    Programme using machine learning based survival models
  period: 2026–
  role: Principal investigator
  description: >-
    Dropout in South African higher education is usually modelled as a yes/no outcome, which
    says who is at risk but not when. This project treats dropout among Extended Curriculum
    Programme students at the University of Pretoria as a time-to-event process, comparing Cox
    proportional hazards models, random survival forests, DeepSurv, and joint models of academic
    performance trajectories and time-to-dropout. Because each new semester of results updates a
    student's risk estimate, support can be offered while a trajectory is still recoverable.


    The intended outputs are a set of dropout predictors that student success coaches and
    academic advisors can act on, a prototype early-warning dashboard in R Shiny, and a
    reproducible analysis codebase in R.
  partners: >-
    Najmeh Nakhaeirad and Jeanine Mwambakana-Mutombo (University of Pretoria), Piet Ntema
    (Sol Plaatje University), Bonelwa Sidumo (University of Limpopo), Nombuso Zondo
    (North-West University)
  note: Submitted for a University of Pretoria Scholarship of Teaching and Learning grant in June 2026; planned over 24 months.
  papers: harris2026deep
