- title: >-
    Predicting student dropout and detecting at-risk students early in the Extended Curriculum
    Programme using machine learning based survival models
  period: 2026–
  principal_investigators:
    - Sphiwe Skhosana (University of Pretoria)
  co_investigators:
    - Najmeh Nakhaeirad (University of Pretoria)
    - Jeanine Mwambakana-Mutombo (University of Pretoria)
    - Piet Ntema (Sol Plaatje University)
    - Bonelwa Sidumo (University of Limpopo)
    - Nombuso Zondo (North-West University)
  funding: Submitted for a University of Pretoria Scholarship of Teaching and Learning grant in June 2026; planned over 24 months
  description: >-
    Dropout in South African higher education is usually modelled as a yes/no outcome, which says
    who is at risk but not when. This project treats dropout among Extended Curriculum Programme
    students at the University of Pretoria as a time-to-event process, comparing Cox proportional
    hazards models, random survival forests, DeepSurv, and joint models of academic performance
    trajectories and time-to-dropout.


    Because each new semester of results updates a student's risk estimate, support can be offered
    while a trajectory is still recoverable, rather than after a module failure or a financial
    arrear has already been recorded.
  outcomes:
    - The strongest predictors of dropout, covering both entry-level factors and in-programme performance, at student level rather than cohort level.
    - A prototype early-warning dashboard in R Shiny showing individual risk trajectories and ranked at-risk lists for student success coaches and academic advisors.
    - A blueprint for an early-warning system that other South African institutions can adopt.
    - A reproducible analysis codebase in R and a peer-reviewed article.
