<!-- MathJax 3 — renders LaTeX in page content.
     Inline:  \\( ... \\)      Display:  $$ ... $$  or  \\[ ... \\]
     Note that single-dollar inline math is deliberately NOT enabled, because it
     collides with ordinary dollar signs in prose. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      tags: 'ams'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'no-mathjax'
    }
  };
</script>
<script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
